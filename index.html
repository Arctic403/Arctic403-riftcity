<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
	<meta name="theme-color" content="#0b0f14">
	<title>RiftCity</title>
	<style>
		:root {
			--bg: #080b10;
			--panel: #111720;
			--panel2: #171e29;
			--line: #26303d;
			--text: #edf2f7;
			--muted: #8995a5;
			--accent: #3b82f6;
			--good: #31c48d;
			--bad: #ef5350;
			--gold: #e4b84a;
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			background: radial-gradient(circle at top, #121a25 0, #080b10 55%);
			color: var(--text);
			font: 15px system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
			min-height: 100vh;
		}

		a {
			color: var(--accent);
			text-decoration: none;
		}

		button {
			font: inherit;
			cursor: pointer;
		}

		.app {
			min-height: 100vh;
			display: flex;
			flex-direction: column;
		}

		.top {
			position: sticky;
			top: 0;
			z-index: 10;
			background: rgba(8, 11, 16, 0.94);
			backdrop-filter: blur(14px);
			border-bottom: 1px solid var(--line);
			padding: 12px 16px;
		}

		.toprow {
			display: flex;
			justify-content: space-between;
			align-items: center;
			margin-bottom: 12px;
		}

		.brand {
			font-weight: 900;
			font-size: 24px;
			letter-spacing: 3px;
		}

		.badge {
			background: linear-gradient(135deg, var(--accent), #60a5fa);
			padding: 6px 12px;
			border-radius: 20px;
			font-size: 13px;
			font-weight: 600;
		}

		.topstats {
			display: flex;
			gap: 8px;
			flex-wrap: wrap;
			justify-content: center;
		}

		.pill {
			background: var(--panel2);
			padding: 8px 14px;
			border-radius: 16px;
			font-size: 12px;
			border: 1px solid var(--line);
			white-space: nowrap;
		}

		.pill b {
			color: var(--accent);
			font-weight: 600;
		}

		.tabs {
			display: flex;
			gap: 0;
			border-bottom: 1px solid var(--line);
			background: var(--panel);
			overflow-x: auto;
		}

		.tab {
			flex: 1;
			min-width: 80px;
			padding: 14px 16px;
			background: none;
			border: none;
			color: var(--muted);
			border-bottom: 3px solid transparent;
			cursor: pointer;
			transition: all 0.2s;
			font-weight: 500;
			text-align: center;
		}

		.tab:hover {
			color: var(--text);
			background: rgba(59, 130, 246, 0.08);
		}

		.tab.active {
			color: var(--accent);
			border-bottom-color: var(--accent);
		}

		.content {
			flex: 1;
			overflow-y: auto;
		}

		.page {
			display: none;
			padding: 20px 16px;
			max-width: 1200px;
			margin: 0 auto;
			width: 100%;
		}

		.page.active {
			display: block;
		}

		.title {
			margin: 0 0 4px 0;
			font-size: 28px;
			font-weight: 900;
		}

		.subtitle {
			color: var(--muted);
			margin: 0 0 20px 0;
			font-size: 14px;
		}

		.grid {
			display: grid;
			gap: 16px;
			margin-bottom: 16px;
		}

		.grid2 {
			grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
		}

		.grid3 {
			grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
		}

		.card {
			background: var(--panel);
			border: 1px solid var(--line);
			border-radius: 12px;
			padding: 18px;
			transition: all 0.2s;
		}

		.card:hover {
			background: var(--panel2);
			border-color: var(--accent);
		}

		.card h3 {
			margin: 0 0 14px 0;
			font-size: 18px;
			font-weight: 700;
		}

		.stat {
			display: flex;
			justify-content: space-between;
			align-items: center;
			padding: 10px 0;
			border-bottom: 1px solid var(--line);
		}

		.stat:last-child {
			border-bottom: none;
		}

		.stat span {
			color: var(--muted);
			font-size: 14px;
		}

		.stat b {
			font-weight: 600;
			color: var(--accent);
		}

		.meterline {
			display: flex;
			justify-content: space-between;
			margin-bottom: 8px;
			font-size: 13px;
		}

		.bar {
			width: 100%;
			height: 8px;
			background: var(--panel2);
			border-radius: 4px;
			overflow: hidden;
		}

		.bar i {
			display: block;
			height: 100%;
			background: linear-gradient(90deg, var(--accent), #60a5fa);
			border-radius: 4px;
		}

		.small {
			font-size: 13px;
			margin-top: 6px;
		}

		.muted {
			color: var(--muted);
		}

		.btn {
			display: block;
			width: 100%;
			padding: 12px 16px;
			background: var(--accent);
			color: white;
			border: none;
			border-radius: 8px;
			font-weight: 600;
			cursor: pointer;
			transition: all 0.2s;
			margin-bottom: 8px;
			text-align: left;
		}

		.btn:hover {
			background: #2563eb;
			transform: translateY(-2px);
		}

		.btn:active {
			transform: translateY(0);
		}

		.btn.secondary {
			background: var(--panel2);
			color: var(--text);
			border: 1px solid var(--line);
		}

		.btn.secondary:hover {
			background: var(--line);
		}

		.btn.danger {
			background: var(--bad);
		}

		.btn.danger:hover {
			background: #e53935;
		}

		.btn.success {
			background: var(--good);
		}

		.btn.success:hover {
			background: #27ae60;
		}

		.navbtn {
			display: flex;
			justify-content: space-between;
			align-items: center;
			width: 100%;
			padding: 12px 14px;
			background: var(--panel2);
			color: var(--text);
			border: 1px solid var(--line);
			border-radius: 8px;
			cursor: pointer;
			font-weight: 500;
			margin-bottom: 8px;
			transition: all 0.2s;
		}

		.navbtn:hover {
			background: var(--line);
			border-color: var(--accent);
		}

		.navlist {
			display: flex;
			flex-direction: column;
		}

		.item {
			display: flex;
			justify-content: space-between;
			align-items: center;
			padding: 12px 0;
			border-bottom: 1px solid var(--line);
			gap: 12px;
		}

		.item:last-child {
			border-bottom: none;
		}

		.item span {
			flex: 1;
			font-size: 14px;
		}

		.item .btn {
			margin: 0;
			width: auto;
			padding: 8px 12px;
			font-size: 13px;
			flex-shrink: 0;
		}

		.action {
			display: flex;
			gap: 8px;
		}

		.action .btn {
			flex: 1;
			margin: 0;
		}

		.notice {
			background: rgba(239, 83, 80, 0.1);
			border-left: 3px solid var(--bad);
			padding: 12px;
			border-radius: 6px;
			color: var(--bad);
			font-weight: 500;
			margin-bottom: 12px;
		}

		.notice.good {
			background: rgba(49, 196, 141, 0.1);
			border-left-color: var(--good);
			color: var(--good);
		}

		.log {
			max-height: 300px;
			overflow-y: auto;
			font-size: 13px;
			line-height: 1.6;
		}

		.log div {
			padding: 6px 0;
			border-bottom: 1px solid var(--line);
			color: var(--muted);
		}

		.log div:last-child {
			border-bottom: none;
		}

		/* Modal/Dialogue Styles */
		.modal-overlay {
			position: fixed;
			top: 0;
			left: 0;
			right: 0;
			bottom: 0;
			background: rgba(0, 0, 0, 0.7);
			display: none;
			align-items: center;
			justify-content: center;
			z-index: 1000;
		}

		.modal-overlay.active {
			display: flex;
		}

		.modal {
			background: var(--panel);
			border: 2px solid var(--accent);
			border-radius: 12px;
			padding: 24px;
			max-width: 500px;
			width: 90%;
			max-height: 80vh;
			overflow-y: auto;
		}

		.modal h2 {
			margin: 0 0 12px 0;
			font-size: 24px;
		}

		.modal-text {
			color: var(--muted);
			margin-bottom: 20px;
			line-height: 1.6;
			font-size: 14px;
		}

		.modal-actions {
			display: flex;
			flex-direction: column;
			gap: 8px;
		}

		.modal-actions .btn {
			margin: 0;
		}

		.encounter {
			background: linear-gradient(135deg, rgba(239, 83, 80, 0.1), rgba(59, 130, 246, 0.05));
			border: 2px solid var(--bad);
			border-radius: 12px;
			padding: 20px;
			margin-bottom: 16px;
		}

		.encounter h3 {
			margin: 0 0 12px 0;
			font-size: 22px;
		}

		.encounter-info {
			margin-bottom: 16px;
		}

		.encounter-info div {
			padding: 8px 0;
			color: var(--muted);
		}

		.encounter-info b {
			color: var(--text);
			font-weight: 600;
		}

		.encounter-actions {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
			gap: 10px;
		}

		.encounter-actions .btn {
			margin: 0;
		}

		@media (max-width: 600px) {
			.grid2 {
				grid-template-columns: 1fr;
			}

			.grid3 {
				grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
			}

			.topstats {
				justify-content: flex-start;
			}

			.pill {
				font-size: 11px;
				padding: 6px 10px;
			}

			.title {
				font-size: 24px;
			}

			.tab {
				min-width: 60px;
				padding: 12px 8px;
				font-size: 13px;
			}

			.encounter-actions {
				grid-template-columns: 1fr;
			}

			.modal {
				width: 95%;
			}
		}
	</style>
</head>
<body>
	<div class="app">
		<header class="top">
			<div class="toprow">
				<div class="brand">RIFTCITY</div>
				<span class="badge" id="levelPill">Level 1</span>
			</div>
			<div class="topstats">
				<span class="pill">💰 <b id="cashTop">$0</b></span>
				<span class="pill">❤️ <b id="healthTop">0/0</b></span>
				<span class="pill">⚡ <b id="energyTop">0/0</b></span>
				<span class="pill">🧠 <b id="nerveTop">0/0</b></span>
				<span class="pill">😊 <b id="happyTop">0</b></span>
			</div>
		</header>
		<nav class="tabs" id="tabs">
			<button class="tab active" data-page="home"><b>⌂</b>Home</button>
			<button class="tab" data-page="character"><b>◉</b>Character</button>
			<button class="tab" data-page="gym"><b>⚔</b>Gym</button>
			<button class="tab" data-page="city"><b>▦</b>City</button>
			<button class="tab" data-page="more"><b>☰</b>More</button>
		</nav>
		<main class="content">
			<section class="page active" id="home"></section>
			<section class="page" id="character"></section>
			<section class="page" id="gym"></section>
			<section class="page" id="city"></section>
			<section class="page" id="more"></section>
		</main>
	</div>

	<!-- Modal for interactions -->
	<div class="modal-overlay" id="modal">
		<div class="modal">
			<h2 id="modalTitle">Interaction</h2>
			<div class="modal-text" id="modalText"></div>
			<div class="modal-actions" id="modalActions"></div>
		</div>
	</div>

	<script>
		const KEY = "riftcity_save_v4", LOGKEY = "riftcity_log_v4";

		const fresh = () => ({
			name: "Rifter",
			level: 1,
			xp: 0,
			cash: 500,
			bank: 0,
			energy: 100,
			maxEnergy: 100,
			nerve: 10,
			maxNerve: 10,
			health: 100,
			maxHealth: 100,
			happiness: 100,
			defaultHappiness: 100,
			happinessResetAt: Date.now() + 1800000,
			jail: 0,
			hospital: 0,
			wanted: 0,
			bounty: 0,
			weapon: null,
			armor: null,
			stats: { strength: 0, defense: 0, dexterity: 0, speed: 0 },
			inventory: {},
			crimes: {},
			gymSessions: 0,
			lastEncounter: null
		});

		let p = load();

		function load() {
			try {
				let x = JSON.parse(localStorage.getItem(KEY));
				return x ? Object.assign(fresh(), x, {
					stats: Object.assign(fresh().stats, x.stats || {}),
					inventory: x.inventory || {},
					crimes: x.crimes || {}
				}) : fresh();
			} catch {
				return fresh();
			}
		}

		function save() {
			localStorage.setItem(KEY, JSON.stringify(p));
		}

		function logs() {
			try {
				return JSON.parse(localStorage.getItem(LOGKEY) || "[]");
			} catch {
				return [];
			}
		}

		function addLog(s) {
			let a = logs();
			a.unshift(new Date().toLocaleTimeString() + " • " + s);
			localStorage.setItem(LOGKEY, JSON.stringify(a.slice(0, 50)));
		}

		function fmt(n) {
			return Math.floor(n).toLocaleString();
		}

		function xpNeed() {
			return Math.floor(100 * Math.pow(1.12, p.level - 1));
		}

		function xpPct() {
			return Math.min(100, p.xp / xpNeed() * 100);
		}

		function totalStats() {
			return Object.values(p.stats).reduce((a, b) => a + b, 0);
		}

		function gymGain(stat) {
			const base = 1.9;
			const happy = 1 + Math.min(p.happiness, 500) / 1000;
			const levelDiminish = 1 / (1 + Math.pow(p.stats[stat] / 250, 0.72));
			const longTerm = 1 / (1 + Math.pow(totalStats() / 1200, 0.55));
			const roll = 0.82 + Math.random() * 0.36;
			return Math.max(0.01, base * happy * levelDiminish * longTerm * roll);
		}

		function spendEnergy(n) {
			if (p.energy < n) {
				addLog("Not enough energy.");
				return false;
			}
			p.energy -= n;
			return true;
		}

		function gainXP(n) {
			p.xp += n;
			while (p.xp >= xpNeed()) {
				p.xp -= xpNeed();
				p.level++;
				p.maxEnergy += 2;
				p.maxNerve += 1;
				p.maxHealth += 5;
				p.health = p.maxHealth;
				addLog("Level up! You reached level " + p.level + ". New system: +2 max energy, +1 max nerve, +5 max health.");
			}
		}

		function unlock(level) {
			return p.level >= level;
		}

		function relax() {
			if (!spendEnergy(10)) return render();
			p.happiness = Math.min(1000, p.happiness + 25);
			addLog("Relaxed: -10 energy, +25 happiness.");
			save();
			render();
		}

		function train(stat) {
			if (p.jail || p.hospital) return addLog("You cannot train while unavailable.");
			if (!spendEnergy(10)) return render();
			let g = gymGain(stat);
			p.stats[stat] += g;
			p.happiness = Math.max(0, p.happiness - 5);
			p.gymSessions++;
			gainXP(7);
			addLog("Gym: " + stat + " +" + g.toFixed(2) + " • happiness -5.");
			save();
			render();
		}

		function showModal(title, text, actions) {
			document.getElementById("modalTitle").textContent = title;
			document.getElementById("modalText").textContent = text;
			const actionsDiv = document.getElementById("modalActions");
			actionsDiv.innerHTML = "";
			actions.forEach(action => {
				const btn = document.createElement("button");
				btn.className = "btn " + (action.type || "");
				btn.textContent = action.text;
				btn.onclick = () => {
					action.callback();
					document.getElementById("modal").classList.remove("active");
				};
				actionsDiv.appendChild(btn);
			});
			document.getElementById("modal").classList.add("active");
		}

		function crime(crimeType, nerve, baseReward, successChance) {
			if (p.jail || p.hospital) {
				addLog("You cannot commit crimes while unavailable.");
				return;
			}
			if (p.nerve < nerve) {
				addLog("Not enough nerve.");
				return;
			}

			p.nerve -= nerve;

			// Crime setup narrative
			const crimeSetups = {
				'Pickpocket': {
					setup: "You spot a mark in the crowd—a wealthy businessman checking his phone. You move in smoothly...",
					options: [
						{ text: "Go for the wallet (high risk)", action: () => attemptCrime(crimeType, baseReward * 1.2, successChance - 0.1) },
						{ text: "Target the watch (medium risk)", action: () => attemptCrime(crimeType, baseReward, successChance) },
						{ text: "Play it safe with loose change", action: () => attemptCrime(crimeType, baseReward * 0.6, successChance + 0.15) }
					]
				},
				'Burglary': {
					setup: "You case the apartment. The owner won't be back for hours. Three entry points: the fire escape, back window, or front door.",
					options: [
						{ text: "Stealth through fire escape", action: () => attemptCrime(crimeType, baseReward, successChance + 0.1) },
						{ text: "Smash and grab through window", action: () => attemptCrime(crimeType, baseReward * 1.3, successChance - 0.15) },
						{ text: "Pick the front lock (slow but safe)", action: () => attemptCrime(crimeType, baseReward * 0.8, successChance + 0.2) }
					]
				},
				'Mugging': {
					setup: "A lone pedestrian walks down the dark alley. They look vulnerable. Your weapon bulges in your jacket.",
					options: [
						{ text: "Intimidate with weapon", action: () => attemptCrime(crimeType, baseReward * 1.1, successChance - 0.05) },
						{ text: "Quick knockout and rob", action: () => attemptCrime(crimeType, baseReward * 0.9, successChance + 0.05) },
						{ text: "Back off—too risky", action: () => { addLog("You decided it was too risky. Backed away."); save(); render(); } }
					]
				},
				'Robbery': {
					setup: "The convenience store clerk is alone. You can see the cash register. Armed robber or fast talker—you decide.",
					options: [
						{ text: "Armed robbery (gun)", action: () => attemptCrime(crimeType, baseReward * 1.4, successChance - 0.2) },
						{ text: "Smooth talking (no weapon)", action: () => attemptCrime(crimeType, baseReward * 0.7, successChance + 0.1) },
						{ text: "Wait for manager shift change", action: () => attemptCrime(crimeType, baseReward * 1.15, successChance + 0.15) }
					]
				}
			};

			const setup = crimeSetups[crimeType] || { setup: "Crime in progress...", options: [] };
			showModal("🎯 " + crimeType, setup.setup, setup.options.map(opt => ({
				text: opt.text,
				callback: opt.action
			})));
		}

		function attemptCrime(n, reward, chance) {
			const roll = Math.random();
			const finalChance = Math.min(0.9, chance + p.level * 0.008);
			let outcome, finalReward = 0;

			if (roll < finalChance * 0.10) {
				outcome = "critical";
				p.jail = 7 + Math.floor(Math.random() * 9);
				p.wanted = Math.min(100, p.wanted + 18);
				p.bounty += Math.floor(reward * 0.8);
				gainXP(6);
				addLog("⚠️ CRITICAL FAIL: " + n + " went badly. You were caught, wanted level increased, and a bounty was placed on you.");
			} else if (roll < finalChance) {
				outcome = "success";
				finalReward = Math.floor(reward * (0.75 + Math.random() * 0.5) * (1 + p.level * 0.012));
				p.cash += finalReward;
				p.crimes[n] = (p.crimes[n] || 0) + 1;
				gainXP(15 + p.level * 2);
				addLog("✅ SUCCESS: " + n + " worked. +$" + fmt(finalReward) + " and XP.");
			} else if (roll < finalChance + (1 - finalChance) * 0.22) {
				outcome = "failed";
				p.wanted = Math.min(100, p.wanted + 6);
				addLog("❌ FAILED: " + n + " failed, but you escaped before police arrived.");
			} else {
				outcome = "arrested";
				p.jail = 3 + Math.floor(Math.random() * 7);
				p.wanted = 0; // Clear wanted level when arrested
				p.bounty += Math.floor(reward * 0.35);
				gainXP(4);
				addLog("🚨 ARRESTED: " + n + " failed and police caught you. Wanted level cleared.");
			}

			p.lastEncounter = { type: "crime", name: n, outcome, reward: finalReward };
			save();
			render();
		}

		function npcEncounter(enemy) {
			if (p.jail || p.hospital) {
				addLog("You cannot start an encounter while unavailable.");
				return;
			}
			const armed = Math.random() < enemy.armedChance;
			const weapon = armed ? (Math.random() < 0.55 ? "knife" : "gun") : null;
			const npc = { ...enemy, armed, weapon };
			p.lastEncounter = { type: "npc", name: npc.name, armed: npc.armed, weapon: npc.weapon, power: npc.power, defense: npc.defense, hp: npc.hp, reward: npc.reward, xp: npc.xp };
			
			let encounterText = npc.name + " blocks your path. ";
			if (npc.armed) {
				encounterText += "They're carrying a " + npc.weapon + " and have a dangerous look in their eyes.";
			} else {
				encounterText += "They appear unarmed but ready for trouble.";
			}

			showModal("⚠️ Encounter: " + npc.name, encounterText, [
				{ text: "🚶 Back away", callback: () => { p.lastEncounter = null; addLog("You backed away from the encounter."); save(); render(); } },
				{ text: "🏳️ Surrender", callback: () => { p.jail = npc.armed ? 4 : 2; p.wanted = Math.min(100, p.wanted + (npc.armed ? 7 : 3)); p.lastEncounter = null; addLog("🚓 You surrendered to " + npc.name + "."); save(); render(); } },
				{ text: "⚔️ Fight (hand-to-hand)", callback: () => { resolveFight(npc, false, npc.armed ? 1.3 : 1, false); } },
				...(p.weapon ? [{ text: "🔫 Armed Fight", callback: () => { const escalation = npc.armed ? 0.20 : 0.08; p.wanted = Math.min(100, p.wanted + Math.round(8 + escalation * 30)); p.bounty += Math.floor(100 + npc.power * 2); resolveFight(npc, true, npc.armed ? 1.3 : 1, true); }, type: "danger" }] : [])
			]);

			addLog("👤 Encounter: " + npc.name + (npc.armed ? " is carrying a " + npc.weapon + "." : " appears unarmed."));
			save();
			render();
		}

		function resolveFight(e, armedResponse, npcWeaponBonus, playerWeapon) {
			document.getElementById("modal").classList.remove("active");
			const playerPower = p.stats.strength * (1 + p.stats.dexterity / 1000) * (playerWeapon ? 1.35 : 1);
			const defense = p.stats.defense;
			const hit = 0.58 + p.stats.dexterity / (p.stats.dexterity + e.power * 2.4) * 0.30;
			const npcPower = e.power * npcWeaponBonus;
			const policeChance = e.armed ? (armedResponse ? 0.26 : 0.14) : 0.06;

			if (Math.random() < policeChance) {
				p.jail = 5 + Math.floor(Math.random() * 8);
				p.wanted = Math.min(100, p.wanted + 15);
				p.bounty += Math.floor(150 + e.power * 3);
				p.lastEncounter = null;
				addLog("🚨 POLICE ARRIVED: the fight attracted attention. You were arrested and a bounty was added.");
				save();
				render();
				return;
			}

			if (Math.random() > hit) {
				p.energy = Math.max(0, p.energy - 5);
				if (e.armed) {
					p.health = Math.max(1, p.health - Math.max(1, Math.round(npcPower * 0.035)));
				}
				addLog("❌ You missed " + e.name + ".");
				save();
				render();
				return;
			}

			const damage = Math.max(1, Math.round(playerPower * 0.13 * (0.85 + Math.random() * 0.3) - e.defense * 0.035));
			const taken = Math.max(1, Math.round(npcPower * 0.08 * (0.85 + Math.random() * 0.3) - defense * 0.025));
			p.health = Math.max(0, p.health - taken);
			p.energy = Math.max(0, p.energy - 5);

			if (p.health <= 0) {
				p.hospital = 15 + Math.floor(Math.random() * 10); // 15-25 minute cooldown
				p.lastEncounter = null;
				addLog("🏥 You lost the fight and got sent to the hospital for " + p.hospital + " minutes!");
			} else if (damage >= e.hp) {
				const reward = e.reward + Math.floor(Math.random() * e.reward);
				p.cash += reward;
				gainXP(e.xp);
				if (playerWeapon) {
					p.wanted = Math.min(100, p.wanted + 5);
					p.bounty += Math.floor(100 + e.power);
				}
				p.lastEncounter = null;
				addLog("🏆 You defeated " + e.name + ". +$" + fmt(reward) + ", +" + e.xp + " XP.");
			} else {
				if (playerWeapon) {
					p.wanted = Math.min(100, p.wanted + 3);
					p.bounty += Math.floor(50 + e.power);
				}
				addLog("⚔️ You hit " + e.name + " for " + damage + " damage, but the encounter continues.");
			}

			save();
			render();
		}

		function fight(e) {
			npcEncounter(e);
		}

		function buy(item, cost) {
			if (p.cash < cost) return addLog("Not enough cash.");
			p.cash -= cost;
			p.inventory[item] = (p.inventory[item] || 0) + 1;
			addLog("Bought " + item + ".");
			save();
			render();
		}

		function equip(type, item, cost) {
			if (p.cash < cost) return addLog("Not enough cash.");
			p.cash -= cost;
			p[type] = item;
			addLog("Equipped " + item + ".");
			save();
			render();
		}

		function deposit() {
			const amount = 100;
			if (p.cash < amount) {
				addLog("Not enough cash to deposit $" + amount);
				return;
			}
			p.cash -= amount;
			p.bank += amount;
			addLog("Deposited $" + fmt(amount) + ". Bank balance: $" + fmt(p.bank));
			save();
			render();
		}

		function withdraw() {
			const amount = 100;
			if (p.bank < amount) {
				addLog("Not enough in bank to withdraw $" + amount);
				return;
			}
			p.bank -= amount;
			p.cash += amount;
			addLog("Withdrew $" + fmt(amount) + ". Bank balance: $" + fmt(p.bank));
			save();
			render();
		}

		function payBail() {
			if (p.jail === 0) {
				addLog("You're not in jail.");
				return;
			}
			const bailCost = Math.floor(p.bounty * 25);
			if (p.cash < bailCost) {
				addLog("Not enough cash for bail. Need $" + fmt(bailCost));
				return;
			}
			p.cash -= bailCost;
			p.jail = 0;
			p.wanted = 0; // Clear wanted level when released
			addLog("You paid $" + fmt(bailCost) + " bail and were released. Wanted level cleared.");
			save();
			render();
		}

		function resetGame() {
			if (confirm("Delete your RiftCity save and start over?")) {
				localStorage.removeItem(KEY);
				localStorage.removeItem(LOGKEY);
				p = fresh();
				addLog("New character created.");
				save();
				render();
			}
		}

		function updateTime() {
			if (Date.now() >= p.happinessResetAt) {
				p.happiness = p.defaultHappiness;
				p.happinessResetAt = Date.now() + 1800000;
				addLog("Happiness reset to default.");
			}
			if (p.jail > 0) p.jail--;
			if (p.hospital > 0) p.hospital--;
			if (p.energy < p.maxEnergy) p.energy = Math.min(p.maxEnergy, p.energy + 5);
			if (p.nerve < p.maxNerve) p.nerve++;
			if (p.health < p.maxHealth && p.hospital === 0) p.health = Math.min(p.maxHealth, p.health + 2);
			save();
			render();
		}

		setInterval(updateTime, 60000);

		function pageHome() {
			const l = logs();
			return `
				<h1 class="title">Welcome back, ${p.name}</h1>
				<div class="subtitle">Build a character over weeks and months, not a weekend.</div>

				<div class="grid grid2">
					<div class="card">
						<h3>Progress</h3>
						<div class="meterline"><span>Level ${p.level}</span><b>${fmt(p.xp)} / ${fmt(xpNeed())} XP</b></div>
						<div class="bar"><i style="width:${xpPct()}%"></i></div>
					</div>
					<div class="card">
						<h3>Happiness</h3>
						<div class="stat"><span>Current</span><b>${fmt(p.happiness)}</b></div>
						<div class="stat"><span>Default</span><b>${fmt(p.defaultHappiness)}</b></div>
						<button class="btn" onclick="relax()">😌 Relax</button>
					</div>
				</div>

				<div class="grid grid2">
					<div class="card">
						<h3>Daily loop</h3>
						<div class="navlist">
							<button class="navbtn" onclick="go('gym')">🏋️ Train your stats <span>→</span></button>
							<button class="navbtn" onclick="go('city')">🏙️ Explore the city <span>→</span></button>
							<button class="navbtn" onclick="go('character')">◉ View character <span>→</span></button>
						</div>
					</div>
					<div class="card">
						<h3>Status</h3>
						${p.jail ? '<div class="notice">🔒 Jail: ' + p.jail + ' minute(s)</div>' : ''}
						${p.hospital ? '<div class="notice">🏥 Hospital: ' + p.hospital + ' minute(s)</div>' : ''}
						${p.wanted > 0 ? '<div class="notice">🔴 Wanted Level: ' + Math.round(p.wanted) + '%</div>' : ''}
						${!p.jail && !p.hospital && p.wanted === 0 ? '<div class="notice good">✅ You\'re clear</div>' : ''}
					</div>
				</div>

				<div class="card">
					<h3>Recent activity</h3>
					<div class="log">${l.map(x => `<div>${x}</div>`).join("") || "Your story starts here."}</div>
				</div>
			`;
		}

		function pageCharacter() {
			return `
				<h1 class="title">Character</h1>
				<div class="subtitle">Your long-term build. There is no magical three-day god mode.</div>

				<div class="grid grid2">
					<div class="card">
						<h3>Core</h3>
						${[['Level', p.level], ['Total stats', totalStats().toFixed(2)], ['Gym sessions', p.gymSessions], ['Cash', '$' + fmt(p.cash)], ['Bank', '$' + fmt(p.bank)]].map(([k, v]) => `<div class="stat"><span>${k}</span><b>${v}</b></div>`).join("")}
					</div>
					<div class="card">
						<h3>Combat build</h3>
						${Object.entries(p.stats).map(([k, v]) => `<div class="stat"><span>${k[0].toUpperCase() + k.slice(1)}</span><b>${v.toFixed(2)}</b></div>`).join("")}
					</div>
				</div>

				<div class="card">
					<h3>Equipment</h3>
					<div class="stat"><span>Weapon</span><b>${p.weapon || "None"}</b></div>
					<div class="stat"><span>Armor</span><b>${p.armor || "None"}</b></div>
				</div>

				<div class="card">
					<h3>Crime History</h3>
					${Object.keys(p.crimes).length ? Object.entries(p.crimes).map(([k, v]) => `<div class="stat"><span>${k}</span><b>${v} time(s)</b></div>`).join("") : '<div class="muted">No crimes committed yet</div>'}
				</div>
			`;
		}

		function pageGym() {
			return `
				<h1 class="title">Gym</h1>
				<div class="subtitle">Training gets slower as your character grows. Investment wins, but the curve gets steep.</div>

				<div class="card">
					<div class="meterline"><span>Energy</span><b>${p.energy}/${p.maxEnergy}</b></div>
					<div class="bar"><i style="width:${p.energy / p.maxEnergy * 100}%"></i></div>
					<div class="small muted">Each training costs 10 energy.</div>
				</div>

				<div class="grid grid2">
					${Object.keys(p.stats).map(s => `
						<div class="card">
							<h3>${s[0].toUpperCase() + s.slice(1)}</h3>
							<div style="font-size:28px;font-weight:900">${p.stats[s].toFixed(2)}</div>
							<div class="small muted" style="margin-bottom: 12px;">Gain per session: ~${gymGain(s).toFixed(2)}</div>
							<button class="btn" onclick="train('${s}')">Train ${s}</button>
						</div>
					`).join("")}
				</div>
			`;
		}

		function pageCity() {
			const enemies = [
				{ name: "Street Thug", power: 25, defense: 12, hp: 100, reward: 100, xp: 30, icon: "🥷", armedChance: 0.4 },
				{ name: "Gang Enforcer", power: 65, defense: 35, hp: 220, reward: 300, xp: 80, icon: "🕶️", armedChance: 0.7 },
				{ name: "Elite Mercenary", power: 150, defense: 80, hp: 500, reward: 800, xp: 200, icon: "🎖️", armedChance: 0.9 }
			];

			return `
				<h1 class="title">RiftCity</h1>
				<div class="subtitle">A city of locations, NPCs and systems. Multiplayer comes later.</div>

				<div class="grid grid2">
					<div class="card">
						<h3>Crimes</h3>
						<button class="btn" onclick="crime('Pickpocket', 3, 120, 0.70)">Pickpocket • 3 nerve</button>
						<button class="btn" onclick="crime('Burglary', 5, 350, 0.55)">Burglary • 5 nerve</button>
						<button class="btn" onclick="crime('Mugging', 7, 500, 0.40)">Mugging • 7 nerve</button>
						<button class="btn" onclick="crime('Robbery', 9, 1200, 0.25)">Robbery • 9 nerve</button>
					</div>

					<div class="card">
						<h3>Combat</h3>
						${enemies.map(e => `
							<div class="item">
								<span>${e.icon} ${e.name}<br><small class="muted">Power ${e.power} • Reward $${e.reward}</small></span>
								<button class="btn" style="width:auto;margin:0;padding:8px 12px;" onclick="fight(${JSON.stringify(e).replace(/"/g, '&quot;')})">Fight</button>
							</div>
						`).join("")}
					</div>
				</div>

				<div class="grid grid2">
					<div class="card">
						<h3>Market</h3>
						<div class="item">
							<span>Energy Drink</span>
							<button class="btn" style="width:auto;margin:0;padding:8px 12px;" onclick="buy('Energy Drink', 75)">Buy $75</button>
						</div>
						<div class="item">
							<span>Health Pack</span>
							<button class="btn" style="width:auto;margin:0;padding:8px 12px;" onclick="buy('Health Pack', 150)">Buy $150</button>
						</div>
					</div>

					<div class="card">
						<h3>Bank</h3>
						<div class="stat"><span>Balance</span><b>$${fmt(p.bank)}</b></div>
						<div class="action">
							<button class="btn" onclick="deposit()">Deposit $100</button>
							<button class="btn secondary" onclick="withdraw()">Withdraw $100</button>
						</div>
					</div>
				</div>

				${p.jail ? `
					<div class="card">
						<h3>In Jail</h3>
						<div class="notice">🔒 You have ${p.jail} minute(s) remaining</div>
						<button class="btn danger" onclick="payBail()">Pay Bail: $${fmt(Math.floor(p.bounty * 25))}</button>
					</div>
				` : ''}

				${p.hospital ? `
					<div class="card">
						<h3>In Hospital</h3>
						<div class="notice">🏥 Recovering: ${p.hospital} minute(s) remaining</div>
						<div class="muted">You're too injured to do anything right now. Rest and recover.</div>
					</div>
				` : ''}
			`;
		}

		function pageMore() {
			return `
				<h1 class="title">More</h1>
				<div class="subtitle">Systems that don't need to clutter the main dashboard.</div>

				<div class="grid grid2">
					<div class="card">
						<h3>Inventory</h3>
						${Object.keys(p.inventory).length ? Object.entries(p.inventory).map(([k, v]) => `<div class="stat"><span>${k}</span><b>x${v}</b></div>`).join("") : '<div class="muted">Empty inventory</div>'}
					</div>

					<div class="card">
						<h3>🔫 BlackMarket Armory</h3>
						<button class="btn" onclick="equip('weapon', 'Combat Knife', 150)">Combat Knife • $150</button>
						<button class="btn danger" onclick="equip('weapon', 'Glock 19', 300)">Glock 19 • $300</button>
						<button class="btn" onclick="buy('9mm Ammo', 50)">9mm Ammo x20 • $50</button>
						<button class="btn" onclick="buy('Knife Ammo', 30)">Knife Sharpening • $30</button>
					</div>
				</div>

				<div class="grid grid2">
					<div class="card">
						<h3>Armor & Gear</h3>
						<button class="btn" onclick="equip('armor', 'Street Jacket', 400)">Street Jacket • $400</button>
						<button class="btn" onclick="equip('armor', 'Kevlar Vest', 1200)">Kevlar Vest • $1200</button>
					</div>

					<div class="card">
						<h3>Status</h3>
						<div class="stat"><span>Wanted Level</span><b>${Math.round(p.wanted)}%</b></div>
						<div class="stat"><span>Bounty</span><b>$${fmt(p.bounty)}</b></div>
					</div>
				</div>

				<div class="grid grid2">
					<div class="card">
						<h3>Coming soon</h3>
						<div class="notice">Jobs • Properties • Travel • Missions • Factions • More NPCs • Deeper economy</div>
					</div>

					<div class="card">
						<h3>Save & Reset</h3>
						<button class="btn secondary" onclick="save();addLog('Game saved locally.');render()">Save locally</button>
						<button class="btn danger" onclick="resetGame()">Reset game</button>
					</div>
				</div>
			`;
		}

		function go(id) {
			document.querySelectorAll(".page").forEach(x => x.classList.remove("active"));
			document.getElementById(id).classList.add("active");
			document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
			document.querySelector(`[data-page="${id}"]`).classList.add("active");
		}

		document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => go(b.dataset.page)));

		function render() {
			document.getElementById("levelPill").textContent = "Level " + p.level;
			document.getElementById("cashTop").textContent = "$" + fmt(p.cash);
			document.getElementById("healthTop").textContent = fmt(p.health) + "/" + fmt(p.maxHealth);
			document.getElementById("energyTop").textContent = fmt(p.energy) + "/" + fmt(p.maxEnergy);
			document.getElementById("nerveTop").textContent = fmt(p.nerve) + "/" + fmt(p.maxNerve);
			document.getElementById("happyTop").textContent = fmt(p.happiness);
			document.getElementById("home").innerHTML = pageHome();
			document.getElementById("character").innerHTML = pageCharacter();
			document.getElementById("gym").innerHTML = pageGym();
			document.getElementById("city").innerHTML = pageCity();
			document.getElementById("more").innerHTML = pageMore();
		}

		if (!logs().length) addLog("Welcome to RiftCity. Your long game starts now.");
		save();
		render();
	</script>
</body>
</html>
